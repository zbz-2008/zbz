<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>朱必正 · 个人简历</title>
    <style>
        /* ===== 中国风 × 油画色彩 ===== */
        :root {
            --color-primary: #7A3B2E;
            --color-primary-light: #A65A4A;
            --color-secondary: #C49A6C;
            --color-secondary-light: #DDB88A;
            --color-accent: #B84A3A;
            --color-bg: #F7F0E6;
            --color-card: #FDFBF7;
            --color-text: #3E2C1F;
            --color-text-light: #7A6A5A;
            --color-border: #DCCCB8;
            --color-shadow: rgba(122, 59, 46, 0.12);
            --radius: 12px;
            --transition: 0.25s ease;
            --font-stack: "华文楷体", "KaiTi", "Times New Roman", "Songti SC", serif;
            --max-width: 1100px;
            --nav-height: 68px;
        }

        [data-theme="dark"] {
            --color-primary: #C49A6C;
            --color-primary-light: #DDB88A;
            --color-secondary: #B84A3A;
            --color-secondary-light: #D96A5A;
            --color-accent: #E8C87A;
            --color-bg: #1E1A16;
            --color-card: #2C241E;
            --color-text: #E8DDD0;
            --color-text-light: #B0A090;
            --color-border: #4A3D32;
            --color-shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-stack);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(196, 154, 108, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(184, 74, 58, 0.06) 0%, transparent 50%);
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, var(--color-secondary) 1px, transparent 2px);
            background-size: 20px 20px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
        }
        body::before { top: 20px; left: 20px; }
        body::after { bottom: 20px; right: 20px; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--color-bg); }
        ::-webkit-scrollbar-thumb { background: var(--color-secondary); border-radius: 4px; }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
        .hidden { display: none !important; }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--color-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 2px solid var(--color-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            transition: background var(--transition), border-color var(--transition);
            box-shadow: 0 2px 12px var(--color-shadow);
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--color-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-family: "华文楷体", "KaiTi", serif;
        }
        .navbar-brand span { color: var(--color-secondary); }

        .navbar-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .navbar-links::-webkit-scrollbar { display: none; }

        .navbar-links a {
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 20px;
            transition: all var(--transition);
            white-space: nowrap;
            font-weight: 500;
            border: 1px solid transparent;
        }
        .navbar-links a:hover,
        .navbar-links a:focus {
            color: var(--color-primary);
            background: var(--color-border);
            border-color: var(--color-secondary);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .navbar-actions button {
            background: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text-light);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        .navbar-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
            border-color: var(--color-secondary);
        }
        .navbar-actions button:focus-visible {
            outline: 2px solid var(--color-secondary);
            outline-offset: 2px;
        }

        /* ===== Hero ===== */
        .hero {
            padding: 48px 0 32px;
            text-align: center;
            position: relative;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-secondary), transparent);
            opacity: 0.3;
        }

        .hero-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 32px var(--color-shadow);
            transition: transform var(--transition);
            border: 4px solid var(--color-card);
            margin-bottom: 12px;
            background: var(--color-border);
        }
        .hero-avatar:hover { transform: scale(1.02); }
        .hero-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .hero h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--color-primary);
            margin-bottom: 2px;
            font-family: "华文楷体", "KaiTi", serif;
        }
        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--color-text-light);
            margin-bottom: 4px;
            font-weight: 400;
        }
        .hero-location {
            font-size: 0.9rem;
            color: var(--color-text-light);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .hero-motto {
            max-width: 600px;
            margin: 0 auto 20px;
            padding: 10px 28px;
            background: var(--color-card);
            border-radius: 40px;
            border: 1px solid var(--color-secondary);
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--color-primary);
            letter-spacing: 3px;
            box-shadow: 0 2px 12px var(--color-shadow);
            display: inline-block;
        }
        .hero-motto span { color: var(--color-secondary); margin: 0 6px; }

        .hero-summary {
            max-width: 720px;
            margin: 0 auto 20px;
            font-size: 0.98rem;
            color: var(--color-text);
            line-height: 1.9;
            text-align: left;
            padding: 0 4px;
        }
        .hero-summary p { margin-bottom: 0.6rem; }
        .hero-summary p:last-child { margin-bottom: 0; }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .hero-tags .tag {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-light);
            transition: all var(--transition);
            box-shadow: 0 1px 4px var(--color-shadow);
        }
        .hero-tags .tag:hover {
            border-color: var(--color-secondary);
            color: var(--color-primary);
            transform: translateY(-2px);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .hero-actions .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--color-border);
            background: var(--color-card);
            color: var(--color-text);
            transition: all var(--transition);
            cursor: pointer;
            box-shadow: 0 1px 4px var(--color-shadow);
        }
        .hero-actions .btn:hover {
            border-color: var(--color-secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--color-shadow);
        }
        .hero-actions .btn-primary {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }
        .hero-actions .btn-primary:hover {
            background: var(--color-primary-light);
            border-color: var(--color-primary-light);
        }
        .hero-actions .btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            fill: currentColor;
        }

        /* ===== 通用 Section ===== */
        section {
            padding: 44px 0 36px;
            scroll-margin-top: calc(var(--nav-height) + 16px);
            position: relative;
        }
        section:not(:last-of-type)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15%;
            width: 70%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-border), transparent);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }
        .section-header h2 {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: 2px;
            font-family: "华文楷体", "KaiTi", serif;
        }
        .section-header .line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--color-secondary), transparent);
            border-radius: 2px;
        }

        /* ===== 经历 ===== */
        .tabs-container { margin-top: 4px; }
        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 2px solid var(--color-border);
            margin-bottom: 20px;
        }
        .tabs-nav button {
            background: transparent;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-text-light);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all var(--transition);
            font-family: inherit;
            border-radius: 8px 8px 0 0;
        }
        .tabs-nav button:hover {
            color: var(--color-text);
            background: var(--color-border);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--color-primary);
            border-bottom-color: var(--color-secondary);
        }
        .tabs-nav button:focus-visible {
            outline: 2px solid var(--color-secondary);
            outline-offset: -2px;
        }
        .tabs-panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tabs-panel[role="tabpanel"][aria-hidden="false"] { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timeline-item {
            position: relative;
            padding-left: 28px;
            padding-bottom: 28px;
            border-left: 2px solid var(--color-border);
        }
        .timeline-item:last-child { padding-bottom: 0; border-left-color: transparent; }
        .timeline-item::before {
            content: '◆';
            position: absolute;
            left: -12px;
            top: 2px;
            color: var(--color-secondary);
            font-size: 1.2rem;
        }
        .timeline-item .head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 6px 14px;
            margin-bottom: 4px;
        }
        .timeline-item .head .title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color-primary);
        }
        .timeline-item .head .org {
            font-weight: 500;
            color: var(--color-text-light);
        }
        .timeline-item .head .date {
            font-size: 0.8rem;
            color: var(--color-text-light);
            margin-left: auto;
            background: var(--color-border);
            padding: 0 14px;
            border-radius: 12px;
            font-weight: 400;
        }
        .timeline-item ul {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
        }
        .timeline-item ul li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 4px;
            font-size: 0.92rem;
            color: var(--color-text);
        }
        .timeline-item ul li::before {
            content: '—';
            position: absolute;
            left: 0;
            color: var(--color-secondary);
        }

        /* ===== 项目 ===== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .project-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 20px 22px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 8px var(--color-shadow);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 32px var(--color-shadow);
            border-color: var(--color-secondary);
        }
        .project-card .name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color-primary);
            margin-bottom: 2px;
        }
        .project-card .meta {
            font-size: 0.8rem;
            color: var(--color-text-light);
            margin-bottom: 8px;
        }
        .project-card .desc {
            font-size: 0.9rem;
            color: var(--color-text);
            flex: 1;
            margin-bottom: 10px;
        }
        .project-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: auto;
        }
        .project-card .tags span {
            background: var(--color-border);
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--color-text-light);
        }

        /* ===== 日常生活画廊 ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .gallery-item {
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 16px var(--color-shadow);
            transition: all var(--transition);
            border: 2px solid var(--color-card);
            background: var(--color-card);
        }
        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 32px var(--color-shadow);
            border-color: var(--color-secondary);
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .gallery-item .caption {
            padding: 8px 12px;
            font-size: 0.8rem;
            color: var(--color-text-light);
            text-align: center;
            background: var(--color-card);
        }

        /* ===== 技能 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .skill-category h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .skill-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .skill-items .badge {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            padding: 2px 16px;
            border-radius: 16px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--color-text);
            transition: all var(--transition);
        }
        .skill-items .badge:hover {
            border-color: var(--color-secondary);
            transform: translateY(-2px);
        }

        /* ===== 教育 & 证书 ===== */
        .edu-cert-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 640px) { .edu-cert-grid { grid-template-columns: 1fr; } }

        .edu-item {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 20px 22px;
            border: 1px solid var(--color-border);
        }
        .edu-item .school {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color-primary);
        }
        .edu-item .major {
            color: var(--color-text-light);
            font-weight: 500;
        }
        .edu-item .detail {
            font-size: 0.85rem;
            color: var(--color-text-light);
            margin-top: 2px;
        }
        .edu-item ul {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
            font-size: 0.88rem;
        }
        .edu-item ul li {
            padding-left: 16px;
            position: relative;
            margin-bottom: 2px;
        }
        .edu-item ul li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--color-secondary);
        }

        .cert-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .cert-item {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 12px 18px;
            border: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all var(--transition);
        }
        .cert-item:hover {
            border-color: var(--color-secondary);
        }
        .cert-item .cert-img {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--color-border);
            border: 1px solid var(--color-border);
            flex-shrink: 0;
        }
        .cert-item .name {
            font-weight: 500;
            color: var(--color-text);
            flex: 1;
        }
        .cert-item .date {
            font-size: 0.8rem;
            color: var(--color-text-light);
        }

        /* ===== Footer ===== */
        .footer {
            padding: 28px 0 20px;
            text-align: center;
            border-top: 2px solid var(--color-border);
            font-size: 0.8rem;
            color: var(--color-text-light);
        }
        .footer span { margin: 0 6px; }

        /* ===== Back to Top ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-primary);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            box-shadow: 0 4px 16px var(--color-shadow);
            transition: all var(--transition);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-top:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
        }
        .back-top:focus-visible { outline: 2px solid var(--color-secondary); outline-offset: 2px; }

        /* ===== Print ===== */
        @media print {
            body { padding-top: 0 !important; background: #fff !important; color: #1a1a1a !important; font-size: 12px; }
            .navbar, .back-top { display: none !important; }
            .hero-actions .btn { border: 1px solid #ccc !important; background: #f5f5f5 !important; color: #1a1a1a !important; box-shadow: none !important; transform: none !important; }
            .hero-actions .btn-primary { background: #1a1a1a !important; color: #fff !important; border-color: #1a1a1a !important; }
            .highlight-card, .project-card, .edu-item, .cert-item, .gallery-item { box-shadow: none !important; border: 1px solid #ddd !important; background: #fafafa !important; transform: none !important; }
            .tabs-nav button { border-bottom: 2px solid #ddd !important; color: #333 !important; }
            .tabs-nav button[aria-selected="true"] { border-bottom-color: #1a1a1a !important; color: #1a1a1a !important; }
            .timeline-item::before { color: #1a1a1a !important; }
            section { padding: 20px 0 !important; page-break-inside: avoid; }
            .hero { padding-top: 16px !important; }
            .container { max-width: 100% !important; padding: 0 16px !important; }
            .hero-summary { text-align: left !important; }
            .hero-tags .tag { border: 1px solid #ccc !important; background: #f5f5f5 !important; box-shadow: none !important; }
            .skills-grid { grid-template-columns: 1fr 1fr !important; }
            .projects-grid { grid-template-columns: 1fr 1fr !important; }
            .gallery-grid { grid-template-columns: 1fr 1fr !important; }
            .section-header .line { display: none !important; }
            .footer { border-top: 1px solid #ddd !important; }
            [data-theme="dark"] * { color: #1a1a1a !important; background: transparent !important; border-color: #ddd !important; }
            [data-theme="dark"] .hero h1, [data-theme="dark"] .section-header h2 { color: #1a1a1a !important; }
            .hero-avatar { background: #1a1a1a !important; color: #fff !important; }
            .timeline-item .head .date { background: #eee !important; }
            .project-card .tags span { background: #eee !important; }
            .hero-motto { border-color: #ccc !important; background: #f5f5f5 !important; }
            .gallery-item .caption { background: #fafafa !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            html { scroll-behavior: auto !important; }
            .tabs-panel { animation: none !important; }
        }

        @media (max-width: 768px) {
            :root { --nav-height: 56px; }
            .navbar-brand { font-size: 1rem; }

        /* ============================================================

        const app = document.getElementById('app');

        function createEl(tag, cls, html) {

            if (cls) el.className = cls;
            if (html) el.innerHTML = html;

        function renderHero() {

        /* ============================================================

            app.replaceChildren(...children);

            document.getElementById('printBtn').addEventListener('click', () => window.print());
            initBackTop();

        /* ============================================================
           TABS
           ============================================================ */
        function initTabs() {
            const containers = qsa('.tabs-container');
            containers.forEach(container => {
                const buttons = qsa('[role="tab"]', container);
                const panels = qsa('[role="tabpanel"]', container);

                function setActiveTab(tabId) {
                    buttons.forEach(btn => {
                        const isActive = btn.id === tabId;
                        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
                        btn.setAttribute('tabindex', isActive ? '0' : '-1');
                    });
                    panels.forEach(p => {
                        const isActive = p.id === tabId.replace('tab-', 'panel-');
                        p.setAttribute('aria-hidden', isActive ? 'false' : 'true');
                    });
                }

                buttons.forEach(btn => {
                    btn.addEventListener('click', () => setActiveTab(btn.id));
                    btn.addEventListener('keydown', (e) => {
                        const idx = buttons.indexOf(btn);
                        let targetIdx = -1;
                        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                            e.preventDefault();
                            targetIdx = (idx + 1) % buttons.length;
                        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                            e.preventDefault();
                            targetIdx = (idx - 1 + buttons.length) % buttons.length;
                        }
                        if (targetIdx >= 0) {
                            buttons[targetIdx].focus();
                            setActiveTab(buttons[targetIdx].id);
                        }
                    });
                });

                if (buttons.length) setActiveTab(buttons[0].id);
            });
        }

        /* ============================================================
           EMAIL COPY

            const btn = document.getElementById('emailCopyBtn');
            if (!btn) return;

                    return;
                }
                navigator.clipboard.writeText(email).then(() => showToast('✅ 邮箱已复制'))
                    .catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = email;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                        showToast('✅ 邮箱已复制');
                    });
            });
        }

        /* ============================================================
           THEME
           ============================================================ */
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let current = localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light');
            applyTheme(current);

            btn.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                localStorage.setItem('theme', next);
            });

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                btn.innerHTML = theme === 'dark' ?
                    `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>` :
                    `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>`;
            }
        }

        /* ============================================================
           BACK TO TOP
           ============================================================ */
        function initBackTop() {
            const btn = document.getElementById('backTop');
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const scrollY = window.scrollY || window.pageYOffset;
                        btn.classList.toggle('visible', scrollY > 400);
                        ticking = false;
                    });
                    ticking = true;
                }
            });
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        }

        /* ============================================================
           TOAST
           ============================================================ */
        function showToast(msg) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();

            const div = document.createElement('div');
            div.className = 'toast-msg';
            div.textContent = msg;
            Object.assign(div.style, {
                position: 'fixed',
                bottom: '80px',
                left: '50%',
                transform: 'translateX(-50%)',
                background: 'var(--color-card)',
                color: 'var(--color-text)',
                padding: '10px 28px',
                borderRadius: '30px',
                boxShadow: '0 8px 32px var(--color-shadow)',
                border: '1px solid var(--color-border)',
                fontSize: '0.9rem',
                fontWeight: '500',
                zIndex: '9999',
                transition: 'opacity 0.25s ease',
                maxWidth: '90%',
                textAlign: 'center',
                fontFamily: 'var(--font-stack)'
            });
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                setTimeout(() => div.remove(), 300);
            }, 2600);
        }

        /* ============================================================
           INIT
           ============================================================ */
        document.addEventListener('DOMContentLoaded', mount);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mount);
        } else {
