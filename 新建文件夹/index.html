<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>朱必正 · 追逐星辰大海</title>
<style>
:root{
  --color-primary:#1B3A6B;
  --color-primary-light:#2E5A9B;
  --color-secondary:#C9A227;
  --color-secondary-light:#E3C05A;
  --color-bg:#EEF3FA;
  --color-card:#FFFFFF;
  --color-text:#16203A;
  --color-text-light:#5A6A85;
  --color-border:#D8E2F0;
  --color-shadow:rgba(27,58,107,.10);
  --star:rgba(27,58,107,.10);
  --star-2:rgba(27,58,107,.06);
  --radius:14px;
  --transition:.25s ease;
  --font-serif:"Songti SC","STSong","华文楷体","KaiTi","Kaiti SC","Times New Roman",serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --max-width:1100px;
  --nav-height:64px;
}
[data-theme="dark"]{
  --color-primary:#8FC1F0;
  --color-primary-light:#B4D8F8;
  --color-secondary:#E3C05A;
  --color-secondary-light:#F0D888;
  --color-bg:#070C1A;
  --color-card:#0E1730;
  --color-text:#E2E9F5;
  --color-text-light:#93A3BF;
  --color-border:#1E2B4A;
  --color-shadow:rgba(0,0,0,.5);
  --star:rgba(255,255,255,.55);
  --star-2:rgba(180,216,248,.35);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;font-size:16px;}
body{
  font-family:var(--font-sans);
  background:var(--color-bg);
  color:var(--color-text);
  line-height:1.7;
  padding-top:0;
  transition:background .35s ease,color .35s ease,padding-top .3s ease;
  -webkit-font-smoothing:antialiased;
}
body.landing-active{overflow:hidden;}
body.site-open{padding-top:var(--nav-height);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--color-bg);}
::-webkit-scrollbar-thumb{background:var(--color-secondary);border-radius:4px;}
.container{max-width:var(--max-width);margin:0 auto;padding:0 24px;}

/* ===== 星空背景层 ===== */
.sky-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  transition:opacity 1s ease .3s;background-repeat:repeat;
  background-image:
    radial-gradient(1px 1px at 20px 30px,var(--star) 50%,transparent 100%),
    radial-gradient(1px 1px at 130px 80px,var(--star) 50%,transparent 100%),
    radial-gradient(1.6px 1.6px at 240px 160px,var(--star-2) 50%,transparent 100%),
    radial-gradient(1px 1px at 350px 60px,var(--star) 50%,transparent 100%),
    radial-gradient(1px 1px at 80px 220px,var(--star-2) 50%,transparent 100%),
    radial-gradient(1.6px 1.6px at 300px 280px,var(--star) 50%,transparent 100%);
  background-size:420px 340px;
}
.sky-layer::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 80% 8%,rgba(80,140,210,.12),transparent 62%),
    radial-gradient(ellipse 55% 45% at 8% 82%,rgba(150,110,215,.10),transparent 62%);
}
body.site-open .sky-layer{opacity:1;}

/* ===== 封面 ===== */
.landing{
  position:fixed;inset:0;z-index:2000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 120% 75% at 50% 112%,#123A5C 0%,transparent 62%),
    radial-gradient(ellipse 90% 60% at 14% 8%,#2A1B4A 0%,transparent 58%),
    radial-gradient(ellipse 80% 60% at 86% 18%,#0E3B4A 0%,transparent 58%),
    linear-gradient(180deg,#03060F 0%,#071427 42%,#0A2036 74%,#05101F 100%);
  transition:transform 1s cubic-bezier(.76,0,.24,1),opacity .85s ease,filter .85s ease;
}
.landing.leaving{transform:translateY(-100%) scale(1.03);opacity:0;filter:blur(8px);pointer-events:none;}
.star-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.landing-glow{
  position:absolute;width:min(880px,130vw);height:min(880px,130vw);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(143,193,240,.20) 0%,rgba(80,140,210,.09) 34%,transparent 70%);
  filter:blur(34px);animation:breathe 9s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.08);opacity:1;}}
.landing-ocean{position:absolute;left:0;right:0;bottom:0;height:40vh;min-height:190px;overflow:hidden;}
.wave{position:absolute;bottom:-2px;left:0;width:200%;height:100%;}
.wave-1{animation:waveSlide 26s linear infinite;opacity:.85;}
.wave-2{animation:waveSlide 17s linear infinite reverse;opacity:.6;}
.wave-3{animation:waveSlide 36s linear infinite;opacity:.45;}
@keyframes waveSlide{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.landing-content{
  position:relative;z-index:5;text-align:center;padding:24px;
  max-width:820px;width:100%;
  animation:riseIn 1.4s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes riseIn{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:none;}}
.landing-badge{
  display:inline-block;padding:5px 22px;border-radius:999px;
  border:1px solid rgba(227,192,90,.35);background:rgba(227,192,90,.06);
  color:#E3C05A;font-size:.72rem;letter-spacing:.5em;text-indent:.5em;
  margin-bottom:22px;font-family:var(--font-serif);
}
.landing-name{
  font-family:var(--font-serif);font-size:clamp(2.6rem,8vw,4.6rem);
  font-weight:700;letter-spacing:.16em;text-indent:.16em;color:#F4F9FF;
  text-shadow:0 0 30px rgba(143,193,240,.55),0 0 80px rgba(80,140,210,.35);
  margin-bottom:12px;line-height:1.15;
}
.landing-role{color:#A9C6E8;font-size:clamp(.85rem,2.4vw,1.05rem);letter-spacing:.28em;text-indent:.28em;margin-bottom:18px;}
.landing-motto{font-family:var(--font-serif);color:#E3C05A;font-size:clamp(.9rem,2.6vw,1.12rem);letter-spacing:.2em;margin-bottom:38px;opacity:.92;}
.enter-btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  padding:15px 46px;border-radius:999px;border:1px solid rgba(227,192,90,.55);
  background:rgba(10,30,55,.34);color:#F0E2B0;font-size:.98rem;
  letter-spacing:.24em;text-indent:.24em;cursor:pointer;font-family:var(--font-serif);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:all .32s ease;
}
.enter-btn::after{
  content:'';position:absolute;inset:-3px;border-radius:999px;
  border:1px solid rgba(227,192,90,.35);
  animation:pulseRing 2.8s ease-out infinite;pointer-events:none;
}
@keyframes pulseRing{0%{transform:scale(1);opacity:.85;}100%{transform:scale(1.3);opacity:0;}}
.enter-btn:hover,.enter-btn:focus-visible{
  background:rgba(227,192,90,.15);border-color:rgba(227,192,90,.95);
  color:#FFF7DC;outline:none;transform:translateY(-2px);
  box-shadow:0 0 44px rgba(227,192,90,.28),inset 0 0 26px rgba(227,192,90,.12);
}
.landing-hint{margin-top:22px;color:rgba(169,198,232,.55);font-size:.75rem;letter-spacing:.2em;animation:blinkHint 3s ease-in-out infinite;}
@keyframes blinkHint{0%,100%{opacity:.35;}50%{opacity:.85;}}

/* ===== 导航栏 ===== */
.navbar{
  position:fixed;top:0;left:0;right:0;height:var(--nav-height);
  background:var(--color-card);border-bottom:1px solid var(--color-border);
  z-index:1000;display:flex;align-items:center;transform:translateY(-100%);
  transition:transform .65s cubic-bezier(.76,0,.24,1),background .3s ease,border-color .3s ease;
  box-shadow:0 2px 14px var(--color-shadow);
}
body.site-open .navbar{transform:translateY(0);}
[data-theme="dark"] .navbar{background:rgba(14,23,48,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.navbar .container{display:flex;align-items:center;justify-content:space-between;width:100%;}
.navbar-brand{font-family:var(--font-serif);font-weight:700;font-size:1.15rem;letter-spacing:.14em;color:var(--color-primary);text-decoration:none;white-space:nowrap;cursor:pointer;}
.navbar-brand span{color:var(--color-secondary);}
.navbar-links{display:flex;align-items:center;gap:2px;list-style:none;overflow-x:auto;scrollbar-width:none;}
.navbar-links::-webkit-scrollbar{display:none;}
.navbar-links a{color:var(--color-text-light);text-decoration:none;font-size:.84rem;padding:5px 13px;border-radius:20px;white-space:nowrap;font-weight:500;transition:all var(--transition);border:1px solid transparent;}
.navbar-links a:hover,.navbar-links a:focus{color:var(--color-primary);background:var(--color-border);border-color:var(--color-secondary);outline:none;}
.navbar-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.navbar-actions button{background:transparent;border:1px solid var(--color-border);color:var(--color-text-light);cursor:pointer;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:all var(--transition);font-size:1rem;}
.navbar-actions button:hover{background:var(--color-border);color:var(--color-text);border-color:var(--color-secondary);}
.navbar-actions button:focus-visible{outline:2px solid var(--color-secondary);outline-offset:2px;}

/* ===== 主内容 ===== */
#app{position:relative;z-index:1;opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .9s ease .15s,transform .9s cubic-bezier(.2,.7,.3,1) .15s;}
body.site-open #app{opacity:1;transform:none;pointer-events:auto;}
section{padding:52px 0 40px;position:relative;scroll-margin-top:calc(var(--nav-height) + 14px);}
#app section,#app .footer{opacity:0;transform:translateY(26px);transition:opacity .75s ease,transform .75s cubic-bezier(.2,.7,.3,1);}
#app section.in,#app .footer.in{opacity:1;transform:none;}
.section-header{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
.section-header h2{font-family:var(--font-serif);font-size:1.65rem;font-weight:700;color:var(--color-primary);letter-spacing:.1em;white-space:nowrap;}
.section-header .line{flex:1;height:1px;background:linear-gradient(90deg,var(--color-secondary),transparent);}

/* ===== Hero ===== */
.hero{padding:56px 0 40px;text-align:center;}
.hero-avatar{width:132px;height:132px;border-radius:50%;overflow:hidden;margin:0 auto 14px;display:block;border:3px solid var(--color-card);box-shadow:0 0 0 1px var(--color-border),0 10px 36px var(--color-shadow),0 0 60px rgba(143,193,240,.18);background:var(--color-border);transition:transform var(--transition);}
.hero-avatar:hover{transform:scale(1.03);}
.hero-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.hero h1{font-family:var(--font-serif);font-size:clamp(1.9rem,5vw,2.6rem);font-weight:700;letter-spacing:.14em;text-indent:.14em;color:var(--color-primary);margin-bottom:4px;}
.hero-subtitle{font-size:1.02rem;color:var(--color-text-light);margin-bottom:6px;letter-spacing:.06em;}
.hero-location{font-size:.88rem;color:var(--color-text-light);margin-bottom:20px;}
.hero-motto{display:inline-block;padding:11px 30px;border-radius:40px;background:var(--color-card);border:1px solid var(--color-secondary);font-family:var(--font-serif);font-size:1.06rem;letter-spacing:.16em;color:var(--color-primary);margin-bottom:24px;box-shadow:0 2px 14px var(--color-shadow);}
.hero-summary{max-width:730px;margin:0 auto 22px;font-size:.95rem;line-height:1.95;text-align:left;color:var(--color-text);}
.hero-summary p{margin-bottom:.65rem;}
.hero-summary p:last-child{margin-bottom:0;}
.hero-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:24px;}
.hero-tags .tag{background:var(--color-card);border:1px solid var(--color-border);padding:4px 17px;border-radius:20px;font-size:.78rem;font-weight:500;color:var(--color-text-light);transition:all var(--transition);}
.hero-tags .tag:hover{border-color:var(--color-secondary);color:var(--color-primary);transform:translateY(-2px);}
.hero-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
.hero-actions .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 22px;border-radius:30px;font-size:.85rem;font-weight:500;text-decoration:none;border:1px solid var(--color-border);background:var(--color-card);color:var(--color-text);transition:all var(--transition);cursor:pointer;font-family:inherit;}
.hero-actions .btn:hover{border-color:var(--color-secondary);transform:translateY(-2px);box-shadow:0 6px 20px var(--color-shadow);}
.hero-actions .btn:focus-visible{outline:2px solid var(--color-secondary);outline-offset:2px;}

/* ===== 经历时间线 ===== */
.timeline-item{position:relative;padding-left:26px;padding-bottom:26px;border-left:1px solid var(--color-border);}
.timeline-item:last-child{padding-bottom:0;border-left-color:transparent;}
.timeline-item::before{content:'';position:absolute;left:-5px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--color-secondary);box-shadow:0 0 0 4px var(--color-bg),0 0 14px var(--color-secondary);}
.timeline-item .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px;}
.timeline-item .title{font-weight:700;font-size:1.06rem;color:var(--color-primary);}
.timeline-item .org{font-weight:500;color:var(--color-text-light);}
.timeline-item .date{font-size:.78rem;color:var(--color-text-light);margin-left:auto;background:var(--color-border);padding:1px 13px;border-radius:12px;}
.timeline-item ul{list-style:none;padding:0;margin-top:4px;}
.timeline-item ul li{position:relative;padding-left:18px;margin-bottom:5px;font-size:.91rem;color:var(--color-text);}
.timeline-item ul li::before{content:'—';position:absolute;left:0;color:var(--color-secondary);}

/* ===== 项目卡片 ===== */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
.project-card{background:var(--color-card);border-radius:var(--radius);padding:22px;border:1px solid var(--color-border);box-shadow:0 2px 10px var(--color-shadow);transition:all var(--transition);display:flex;flex-direction:column;}
.project-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px var(--color-shadow);border-color:var(--color-secondary);}
.project-card .name{font-family:var(--font-serif);font-weight:700;font-size:1.08rem;color:var(--color-primary);margin-bottom:3px;}
.project-card .meta{font-size:.78rem;color:var(--color-text-light);margin-bottom:10px;}
.project-card .desc{font-size:.89rem;flex:1;margin-bottom:12px;}
.project-card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;}
.project-card .tags span{background:var(--color-border);padding:2px 13px;border-radius:12px;font-size:.68rem;font-weight:500;color:var(--color-text-light);}

/* ===== 技能 ===== */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;}
.skill-category h4{font-family:var(--font-serif);font-size:.9rem;font-weight:700;color:var(--color-primary);margin-bottom:10px;letter-spacing:.08em;}
.skill-items{display:flex;flex-wrap:wrap;gap:6px;}
.skill-items .badge{background:var(--color-card);border:1px solid var(--color-border);padding:3px 15px;border-radius:16px;font-size:.77rem;font-weight:500;color:var(--color-text);transition:all var(--transition);}
.skill-items .badge:hover{border-color:var(--color-secondary);transform:translateY(-2px);}

/* ===== 兴趣爱好 ===== */
.hobbies-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;}
.hobby-card{
  background:var(--color-card);border-radius:var(--radius);padding:26px 24px;
  border:1px solid var(--color-border);box-shadow:0 2px 10px var(--color-shadow);
  transition:all .3s ease;position:relative;overflow:hidden;
}
.hobby-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--color-secondary),transparent);
  opacity:0;transition:opacity .3s ease;
}
.hobby-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px var(--color-shadow);border-color:var(--color-secondary);}
.hobby-card:hover::before{opacity:1;}
.hobby-icon{width:48px;height:48px;margin-bottom:14px;opacity:.85;}
.hobby-icon svg{width:100%;height:100%;}
.hobby-card .hobby-title{
  font-family:var(--font-serif);font-weight:700;font-size:1.05rem;
  color:var(--color-primary);margin-bottom:6px;letter-spacing:.06em;
}
.hobby-card .hobby-poem{
  font-family:var(--font-serif);font-size:.82rem;color:var(--color-secondary);
  letter-spacing:.08em;margin-bottom:10px;opacity:.9;
}
.hobby-card .hobby-desc{font-size:.88rem;color:var(--color-text);line-height:1.8;}

/* ===== 教育 & 证书 ===== */
.edu-cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media (max-width:640px){.edu-cert-grid{grid-template-columns:1fr;}}
.edu-item{background:var(--color-card);border-radius:var(--radius);padding:22px;border:1px solid var(--color-border);box-shadow:0 2px 10px var(--color-shadow);}
.edu-item .school{font-family:var(--font-serif);font-weight:700;font-size:1.14rem;color:var(--color-primary);}
.edu-item .major{color:var(--color-text-light);font-weight:500;margin-top:2px;}
.edu-item .detail{font-size:.84rem;color:var(--color-text-light);margin-top:4px;}
.edu-item ul{list-style:none;padding:0;margin:10px 0 0;font-size:.87rem;}
.edu-item ul li{position:relative;padding-left:16px;margin-bottom:3px;}
.edu-item ul li::before{content:'•';position:absolute;left:0;color:var(--color-secondary);}
.cert-list{display:flex;flex-direction:column;gap:12px;}
.cert-item{background:var(--color-card);border-radius:var(--radius);padding:14px 18px;border:1px solid var(--color-border);display:flex;align-items:center;gap:14px;transition:all var(--transition);box-shadow:0 2px 10px var(--color-shadow);}
.cert-item:hover{border-color:var(--color-secondary);transform:translateY(-2px);}
.cert-item .cert-img{width:58px;height:58px;border-radius:8px;object-fit:cover;background:var(--color-border);border:1px solid var(--color-border);flex-shrink:0;}
.cert-item .name{font-weight:500;flex:1;font-size:.93rem;}
.cert-item .date{font-size:.78rem;color:var(--color-text-light);}

/* ===== 日常生活画廊 ===== */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
.gallery-item{border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 22px var(--color-shadow);border:1px solid var(--color-border);background:var(--color-card);transition:all .3s ease;}
.gallery-item:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 16px 40px var(--color-shadow);border-color:var(--color-secondary);}
.gallery-item img{width:100%;height:210px;object-fit:cover;display:block;}
.gallery-item .caption{padding:9px 12px;font-size:.78rem;color:var(--color-text-light);text-align:center;letter-spacing:.08em;}

/* ===== Footer ===== */
.footer{padding:32px 0 24px;text-align:center;border-top:1px solid var(--color-border);font-size:.79rem;color:var(--color-text-light);letter-spacing:.06em;}
.footer span{margin:0 6px;}

/* ===== 返回顶部 ===== */
.back-top{position:fixed;bottom:28px;right:28px;width:44px;height:44px;border-radius:50%;background:var(--color-primary);color:#fff;border:none;cursor:pointer;font-size:1.25rem;z-index:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px var(--color-shadow);opacity:0;visibility:hidden;transform:translateY(12px);transition:all var(--transition);}
.back-top.visible{opacity:1;visibility:visible;transform:translateY(0);}
.back-top:hover{background:var(--color-primary-light);transform:translateY(-2px);}

/* ===== 打印 ===== */
@media print{
  body{padding-top:0 !important;background:#fff !important;color:#111 !important;font-size:12px;}
  .landing,.navbar,.back-top,.sky-layer{display:none !important;}
  #app,#app section,#app .footer{opacity:1 !important;transform:none !important;}
  section{padding:18px 0 !important;page-break-inside:avoid;}
  .container{max-width:100% !important;padding:0 14px !important;}
  .project-card,.edu-item,.cert-item,.gallery-item,.hobby-card{box-shadow:none !important;border:1px solid #ddd !important;background:#fafafa !important;transform:none !important;}
  .gallery-item img{height:140px !important;}
  .hero-avatar{box-shadow:none !important;border:1px solid #ccc !important;}
  .hero-motto{border-color:#ccc !important;background:#f5f5f5 !important;}
  .section-header .line{display:none !important;}
  .hero-actions .btn{border:1px solid #ccc !important;background:#f5f5f5 !important;color:#111 !important;}
  .hobby-icon{opacity:1 !important;}
}

/* ===== 响应式 ===== */
@media (max-width:860px){
  .navbar-links a{font-size:.76rem;padding:5px 9px;}
}
@media (max-width:768px){
  :root{--nav-height:56px;}
  .navbar-brand{font-size:1rem;}
  .navbar-links{display:none;}
  .hero{padding:36px 0 28px;}
  .hero-avatar{width:104px;height:104px;}
  .projects-grid{grid-template-columns:1fr;}
  .skills-grid{grid-template-columns:1fr 1fr;}
  .hobbies-grid{grid-template-columns:1fr;}
  .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .gallery-item img{height:160px;}
  .timeline-item .head{flex-direction:column;align-items:flex-start;gap:2px;}
  .timeline-item .date{margin-left:0;}
}
@media (max-width:480px){
  .container{padding:0 16px;}
  .skills-grid{grid-template-columns:1fr;}
  .hero-avatar{width:86px;height:86px;}
  .hero-motto{font-size:.94rem;padding:9px 18px;letter-spacing:.1em;}

/* ==========================================================
   滚动淡入
   ========================================================== */
let sectionObserver = null;
function observeSections(){
  const items = qsa('#app section, #app .footer');
  if(!('IntersectionObserver' in window)){
    items.forEach(el=>el.classList.add('in'));
    return;
  }
  if(sectionObserver) sectionObserver.disconnect();
  sectionObserver = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        en.target.classList.add('in');
        sectionObserver.unobserve(en.target);
      }
    });
  },{threshold:0.06, rootMargin:'0px 0px -50px 0px'});
  items.forEach(el=>sectionObserver.observe(el));
}

const starfield = (function(){
  const canvas = document.getElementById('starCanvas');
  if(!canvas) return {start(){},stop(){}};
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=0,h=0,dpr=1,stars=[],meteors=[],rafId=null,running=false,lastMeteor=0;

  function buildStars(){
    const count = Math.min(240, Math.max(70, Math.floor(w*h/9000)));
    stars = [];
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*w, y: Math.random()*h,
        r: Math.random()*1.4 + 0.3,
        base: Math.random()*0.5 + 0.28,
        phase: Math.random()*Math.PI*2,
        speed: 0.4 + Math.random()*1.2,
        drift: (Math.random()-0.5)*0.06
      });
    }
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.max(1, Math.floor(w*dpr));
    canvas.height = Math.max(1, Math.floor(h*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildStars();
  }

  function spawnMeteor(){
    meteors.push({
      x: Math.random()*w*0.8, y: Math.random()*h*0.35,
      len: 110 + Math.random()*150,
      speed: 4 + Math.random()*3,
      angle: Math.PI/4 + (Math.random()-0.5)*0.3,
      life: 1
    });
  }

  function frame(t){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      const tw = reduce ? 1 : (0.62 + 0.38*Math.sin(t*0.001*s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(220,238,255,' + (s.base*tw).toFixed(3) + ')';
      ctx.fill();
      if(!reduce){
        s.y -= 0.012*s.speed;
        s.x += s.drift;
        if(s.y < -2){ s.y = h+2; s.x = Math.random()*w; }
        if(s.x < -2) s.x = w+2;
        if(s.x > w+2) s.x = -2;
      }
    }
    if(!reduce && t - lastMeteor > 3400 + Math.random()*3200){
      spawnMeteor(); lastMeteor = t;
    }
    for(let i=meteors.length-1;i>=0;i--){
      const m = meteors[i];
      const dx = Math.cos(m.angle)*m.len;
      const dy = Math.sin(m.angle)*m.len;
      const g = ctx.createLinearGradient(m.x, m.y, m.x-dx, m.y-dy);
      g.addColorStop(0,'rgba(255,255,255,'+(0.9*m.life).toFixed(3)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x-dx, m.y-dy); ctx.stroke();
      m.x += Math.cos(m.angle)*m.speed;
      m.y += Math.sin(m.angle)*m.speed;
      m.life -= 0.012;
      if(m.life <= 0 || m.x > w+240 || m.y > h+240) meteors.splice(i,1);
    }
    rafId = requestAnimationFrame(frame);
  }

  function start(){ if(running) return; running = true; resize(); rafId = requestAnimationFrame(frame); }
  function stop(){ running = false; if(rafId) cancelAnimationFrame(rafId); rafId = null; }
  window.addEventListener('resize', ()=>{ if(running) resize(); });
  return {start, stop};
})();

/* ==========================================================
   封面 ↔ 内容 切换
   ========================================================== */
const landing = document.getElementById('landing');
let entered = false;

function enterSite(){
  if(entered) return;
  entered = true;
  landing.classList.add('leaving');
  document.body.classList.remove('landing-active');
  document.body.classList.add('site-open');
  window.scrollTo(0,0);
  setTimeout(()=>{
    landing.style.display = 'none';
    starfield.stop();
    observeSections();
  }, 1000);
}

function backToCover(){
  if(!entered) return;
  entered = false;
  window.scrollTo(0,0);
  landing.style.display = '';
  void landing.offsetWidth;
  landing.classList.remove('leaving');
  document.body.classList.remove('site-open');
  document.body.classList.add('landing-active');
  starfield.start();
}

/* ==========================================================
   交互
   ========================================================== */
function initEmailCopy(){
  const btn = document.getElementById('emailCopyBtn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    const email = btn.dataset.email || '';
    if(!email || email === '待补充' || email === 'zhu.bizheng@example.com'){
      showToast('📧 ' + (email === '待补充' ? '邮箱待补充' : '请替换为真实邮箱地址'));
      return;
    }
    const done = ()=>showToast('✅ 邮箱已复制');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(email).then(done).catch(()=>fallbackCopy(email,done));
    } else {
      fallbackCopy(email,done);
    }
  });
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ showToast('复制失败，请手动选择'); }
  ta.remove();
}

function initTheme(){
  const btn = document.getElementById('themeToggle');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const saved = localStorage.getItem('theme');
  apply(saved || (prefersDark ? 'dark' : 'light'));
  btn.addEventListener('click', ()=>{
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next); localStorage.setItem('theme', next);
  });
  function apply(theme){
    document.documentElement.setAttribute('data-theme', theme);
    btn.innerHTML = theme === 'dark'
      ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }
}

function initBackTop(){
  const btn = document.getElementById('backTop');
  let ticking = false;
  window.addEventListener('scroll', ()=>{
    if(!ticking){
      window.requestAnimationFrame(()=>{
        btn.classList.toggle('visible', window.scrollY > 420);
        ticking = false;
      });
      ticking = true;
    }
  }, {passive:true});
  btn.addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));
}

function showToast(msg){
  const old = document.querySelector('.toast-msg');
  if(old) old.remove();
  const div = document.createElement('div');
  div.className = 'toast-msg'; div.textContent = msg;
  Object.assign(div.style,{
    position:'fixed',bottom:'84px',left:'50%',transform:'translateX(-50%)',
    background:'var(--color-card)',color:'var(--color-text)',
    padding:'10px 26px',borderRadius:'30px',
    boxShadow:'0 10px 34px var(--color-shadow)',
    border:'1px solid var(--color-border)',
    fontSize:'.88rem',fontWeight:'500',zIndex:'9999',
    transition:'opacity .28s ease',maxWidth:'90%',
    textAlign:'center',fontFamily:'var(--font-sans)'
  });
  document.body.appendChild(div);
  setTimeout(()=>{ div.style.opacity = '0'; setTimeout(()=>div.remove(), 320); }, 2600);
}

/* ==========================================================
   封面交互
   ========================================================== */
document.getElementById('enterBtn').addEventListener('click', enterSite);
landing.addEventListener('wheel', (e)=>{ if(Math.abs(e.deltaY) > 18) enterSite(); }, {passive:true});
let touchStartY = null;
landing.addEventListener('touchstart', (e)=>{ touchStartY = e.touches[0].clientY; }, {passive:true});
landing.addEventListener('touchend', (e)=>{
  if(touchStartY === null) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  if(Math.abs(dy) > 40) enterSite();
  touchStartY = null;
}, {passive:true});
document.addEventListener('keydown', (e)=>{
  if(!entered && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown')){
    e.preventDefault(); enterSite();
  }
  if(entered && e.key === 'Escape'){ backToCover(); }
});

/* ==========================================================
   启动
   ========================================================== */
function boot(){ mount(); starfield.start(); }
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else { boot(); }
</script>
